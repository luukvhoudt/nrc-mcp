      - {name: noise, type: sound, confidence: verified, source: gamepack_entities, editor_label: "Sound File", description: "Path/name of .wav file to play. Use looping sounds only (e.g. sound/world/drone6.wav)."}
    spawnflags:
      - {name: X_AXIS, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "X_axis", description: "Entity will rotate along the X axis."}
