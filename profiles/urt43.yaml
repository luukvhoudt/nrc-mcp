    kind: point
    category: utility
    confidence: verified
    source: gamepack_entities
    editor_box: "-16 -16 -16 16 16 16"   # xmin ymin zmin xmax ymax zmax
    description: "Default spectator position/Camera for intermission screen between matches. Can be aimed by setting the \"angles\" key or targeting an pointing to an aiming entity. Use only one per level!"
    keys:
      - {name: angle, type: angle, confidence: verified, source: gamepack_entities, editor_label: "Direction", description: "Direction in which player will look."}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "Alternate pitch, yaw, roll angles method of aiming intermission camera (default 0 0 0)."}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "Point this to an info_notnull or target_position entity to set the camera's pointing angles."}
    spawnflags: []
  - classname: misc_portal_camera
    kind: point
    category: utility
    confidence: verified
    source: gamepack_entities
    editor_box: "-8 -8 -8 8 8 8"   # xmin ymin zmin xmax ymax zmax
    description: "Portal camera. This camera is used to project its view onto a portal surface in the level through the intermediary of a misc_portal_surface entity. Use the \"angle\", \"angles\" keys or target a target_position or info_notnull entity to set the camera's pointing direction."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "Both the setting \"angle(s)\" key or \"targeting a target_position\" methods can be used to aim the camera. In both cases, the \"roll\" key must be used to set the roll angle. If either the SLOWROTATE or FASTROTATE spawnflag is set, then the \"roll\" value is irrelevant."}
    key_blocks: [spawn_filter]
    keys:
      - {name: angle, type: angle, confidence: verified, source: gamepack_entities, editor_label: "Yaw Angle", description: "Yaw aiming angle of the portal camera (default 0)."}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "This sets the pitch and yaw aiming angles of the portal camera (default 0 0). Use \"roll\" key to set roll angle."}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "Point this to a target_position entity to set the camera's pointing direction."}
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Target Name", description: "A misc_portal_surface portal surface indicator must point to this."}
      - {name: roll, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Roll", description: "Roll angle of camera. For axial directions a value of 0 is upside down and 180 is the same as the player's view. For other sorts of directions values of 90 and -90 may work (inconsistent math)."}
    spawnflags:
      - {name: SLOWROTATE, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Rotate Slowly", description: "Makes the portal camera rotate slowly along the roll axis."}
      - {name: FASTROTATE, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Rotate Faster", description: "Makes the portal camera rotate faster along the roll axis."}
      - {name: NOWOBBLE, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "No Wobble", description: "Stops the camera portal from wobbling."}
