# profiles/urt43.yaml
#
# Urban Terror 4.3 entity ontology, extracted from the installed
# NetRadiant-custom Urban Terror gamepack. Data only - no code reads Urban
# Terror identifiers from anywhere but this file and corpus/.
#
# CONFIDENCE SEMANTICS (hard requirement, a validator depends on it):
#   verified    - the fact is literally present in one of the files listed under
#                 profile.sources. Downstream validators may emit hard failures.
#   unverified  - believed true from documentation/general knowledge but NOT
#                 present in those files. Lives only under the top-level
#                 `unverified:` section. Never a hard failure.
# Every entity, every key and every spawnflag carries `confidence` and `source`.
# Keys shared by many classes are factored into `key_blocks:`; an entity that
# lists a block name inherits that block's keys, and the block itself carries
# the confidence/source for those keys.
#
# `description` and `notes` are the gamepack's own wording, whitespace-collapsed
# (a trailing "..." means the text was longer than the cap). `notes` holds the
# entry's prose sections (NOTES, and prose that names a key the gamepack talks
# about but does not declare, e.g. worldspawn gravity or func_door CRUSHER).
# All of it is documentation, not validation input.

profile:
  id: urt43
  game: "Urban Terror 4.3"
  basegame: q3ut4
  radiant_build: "NetRadiant-custom-20240309"
  extracted: "2026-08-01"
  # Where every fact below came from, so a reader can re-verify. Paths are
  # relative to the NetRadiant-custom install's gamepacks/ directory.
  sources:
    - id: gamepack_entities
      path: "urt.game/q3ut4/urtentities.ent"
      radiant_build: "NetRadiant-custom-20240309"
      bytes: 128287
      authored: "quak, 2022-02-11 (per file header)"
      note: "installed gamepack; authoritative for classnames, keys and spawnflags"
    - id: gamepack_objects
      path: "urt.game/q3ut4/urtobjects.ent"
      radiant_build: "NetRadiant-custom-20240309"
      bytes: 66583
      authored: "quak, 2022-01-12 (per file header); based on ut_item_drop.def by Delirium"
      note: "installed gamepack; authoritative for item and weapon pickup classnames"
    - id: gamepack_measurements
      path: "urt.game/q3ut4/measurment.def"
      radiant_build: "NetRadiant-custom-20240309"
      authored: "quak, 2022-01-12 (per file header)"
      note: >-
        dummy measuring entities, not gameplay entities. The file states exact
        player/movement dimensions in its NOTES blocks; those exact values are
        the source for units: and movement: below. The brush sizes on the QUAKED
        lines are deliberately rounded to whole units (and widened to 32x32).
    - id: gamepack_shaderlist
      path: "urt.game/q3ut4/default_shaderlist.txt"
      radiant_build: "NetRadiant-custom-20240309"
      note: "shader script load order shipped with the gamepack"
    - id: gamepack_gamefile
      path: "games/urt.game"
      radiant_build: "NetRadiant-custom-20240309"
      note: "editor game descriptor; source for basegame, engine names, asset types"

# Editor/engine facts from games/urt.game (verbatim attribute values).
editor:
  confidence: verified
  source: gamepack_gamefile
  type: q3
  name: "Urban Terror"
  basegame: q3ut4
  basegamename: "Urban Terror"
  prefix: ".q3a"
  engine:
    win32: "Quake3-UrT.exe"
    linux: "Quake3-UrT.x86_64"
    macos: "Quake3-UrT.app"
  enginepath:
    win32: "C:/Program Files/UrbanTerror43/"
    linux: "/usr/local/games/UrbanTerror43/"
    macos: "/Applications/UrbanTerror43/"
  shaderpath: scripts
  archivetypes: [pk3]
  texturetypes: [tga, jpg, png]
  maptypes: [mapq3]
  entityclasstype: [def, xml]
  default_scale: 0.5
  common_shaders_dir: "common/"
  shader_trigger: "textures/common/trigger"
  q3map2_type: quake3

units:
  # The gamepack never names a real-world scale, so none is asserted here.
  system: quake_units
  confidence: verified
  source: gamepack_measurements
  note: >-
    All figures below are the "Exact:" values stated in measurment.def NOTES
    blocks. Where measurment.def gives no exact figure, only the (rounded) brush
    size from its QUAKED line is recorded, flagged as rounded_only.
  player:
    bounding_box:
      width_x: 30.250
      width_y: 30.250
      height_stand: 69.375
      confidence: verified
      source: gamepack_measurements
      from_entity: measure_perfect_player
      note: >-
        measurment.def: "Exact player sizes. Exact: x=30.250 y=30.250 z=69.375".
        Its other measuring brushes use 32x32 width and whole-unit heights on
        purpose, because grid size below 1 should not be used.
    height_crouch:
      value: 48.250
      rounded_brush: 49
      confidence: verified
      source: gamepack_measurements
      from_entity: measure_player_crouch
    eye_height:
      confidence: unverified
      note: "measurment.def does not state an eye/view height - see unverified:"

movement:
  confidence: verified
  source: gamepack_measurements
  note: >-
    Clearances and heights a player can traverse, as measured empirically by the
    gamepack author. Each entry names the measuring entity it came from so it can
    be re-checked in the editor.
  step_height:
    value: 18.000
    from_entity: measure_step_up
    description: "Max height a player can walk up without needing to jump."
    confidence: verified
    source: gamepack_measurements
  headroom_stand:
    value: 69.375
    rounded_brush: 70
    from_entity: measure_player_stand
    description: "Standing player height."
    confidence: verified
    source: gamepack_measurements
  headroom_crouch:
    value: 48.250
    rounded_brush: 49
    from_entity: measure_player_crouch
    description: "Crouching player height."
    confidence: verified
    source: gamepack_measurements
  jump_clearance_stationary:
    value_approx: 117
    rounded_brush: 118
    exact_text: "117.xxx"
    from_entity: measure_jump_stationary
    description: "Lowest possible height you can jump under without hitting your head."
    confidence: verified
    source: gamepack_measurements
  jump_clearance_crouchjump:
    value_approx: 96
    rounded_brush: 97
    exact_text: "96.xxx"
    from_entity: measure_jump_crouch
    description: >-
      Lowest possible height you can crouch-jump under without hitting your head
      (jump then instantly crouch; tested with scripted perfect crouch input).
    confidence: verified
    source: gamepack_measurements
  jump_up_max:
    value: 66.500
    rounded_brush: 66
    from_entity: measure_jump_up
    description: "Max height you can jump up and land on top of a platform without grabbing."
    confidence: verified
    source: gamepack_measurements
  ledge_grab_min:
    value: 60.375
    rounded_brush: 61
    from_entity: measure_jump_grab_min
    description: "Minimum height you can jump up and grab a ledge."
    confidence: verified
    source: gamepack_measurements
  ledge_grab_max:
    value: 114.625
    rounded_brush: 114
    from_entity: measure_jump_grab_max
    description: "Max height you can jump up and grab a ledge, without walljumping on it."
    confidence: verified
    source: gamepack_measurements
  ledge_grab_max_walljump:
    value: 118.750
    rounded_brush: 118
    from_entity: measure_jump_grab_max_wj
    description: "Max height you can jump up and grab a ledge, while walljumping on it."
    confidence: verified
    source: gamepack_measurements
  fall_damage:
    confidence: verified
    source: gamepack_measurements
    note: "Drop distances measured from full health."
    thresholds:
      - {band: none,       max_drop: 200.125, rounded_brush: 200, from_entity: measure_fall_nohurt,
         description: "Max fall distance you can drop with no damage taken.",
         confidence: verified, source: gamepack_measurements}
      - {band: healthy,    rounded_brush: 231, exact_stated: false, from_entity: measure_fall_hurt1,
         description: "Max drop that barely damages, leaving the Healthy range.",
         confidence: verified, source: gamepack_measurements, rounded_only: true}
      - {band: wounded,    rounded_brush: 299, exact_stated: false, from_entity: measure_fall_hurt2,
         description: "Max drop that leaves the Wounded range.",
         confidence: verified, source: gamepack_measurements, rounded_only: true}
      - {band: near_death, rounded_brush: 394, exact_stated: false, from_entity: measure_fall_hurt3,
         description: "Max drop that leaves the Near Death range, still healable before bleeding out.",
         confidence: verified, source: gamepack_measurements, rounded_only: true}
      - {band: fatal,      min_drop: 394.125, rounded_brush: 395, from_entity: measure_fall_death,
         description: "A fall from this or higher results in death.",
         confidence: verified, source: gamepack_measurements}
  gravity:
    default: 800
    confidence: verified
    source: gamepack_entities
    note: >-
      worldspawn entry: "gravity: Don't use this! Gravity of level (default 800 =
      normal gravity)... Use trigger_gravity instead!". trigger_gravity takes a
      fraction of normal gravity (1.0 = 100%).

# The measuring entities themselves. They are real classnames in the gamepack
# but have no gameplay effect and the file says to remove them before a final
# compile - so a validator should flag them as leftovers, not as content.
measurement_entities:
  confidence: verified
  source: gamepack_measurements
  kind: point
  remove_before_release: true
  note: >-
    "None of these entities have any effect on the gameplay, but it is probably
    better to remove them before final compile."
  classnames:
    - {classname: measure_perfect_player, brush_size: "30.250 30.250 69.375", description: "Exact player sizes."}
    - {classname: measure_step_up, brush_size: "32 32 18", description: "Step up height."}
    - {classname: measure_player_stand, brush_size: "32 32 70", description: "Standing player height."}
    - {classname: measure_player_crouch, brush_size: "32 32 49", description: "Crouching player height."}
    - {classname: measure_jump_stationary, brush_size: "32 32 118", description: "Lowest height you can jump under without hitting your head."}
    - {classname: measure_jump_crouch, brush_size: "32 32 97", description: "Lowest height you can crouch-jump under without hitting your head."}
    - {classname: measure_jump_up, brush_size: "32 32 66", description: "Max height you can jump up and land on top of."}
    - {classname: measure_jump_grab_max, brush_size: "32 32 114", description: "Max height you can jump up and grab a ledge."}
    - {classname: measure_jump_grab_max_wj, brush_size: "32 32 118", description: "Max ledge grab height while walljumping on it."}
    - {classname: measure_jump_grab_min, brush_size: "32 32 61", description: "Minimum height you can jump up and grab a ledge."}
    - {classname: measure_fall_nohurt, brush_size: "32 32 200", description: "Max fall distance with no damage."}
    - {classname: measure_fall_hurt1, brush_size: "32 32 231", description: "Max fall leaving the Healthy range."}
    - {classname: measure_fall_hurt2, brush_size: "32 32 299", description: "Max fall leaving the Wounded range."}
    - {classname: measure_fall_hurt3, brush_size: "32 32 394", description: "Max fall leaving the Near Death range."}
    - {classname: measure_fall_death, brush_size: "32 32 395", description: "A fall from this or higher results in death."}

