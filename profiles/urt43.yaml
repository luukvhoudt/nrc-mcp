# ---------------------------------------------------------------------------
# DISCREPANCIES
# Claims that were put to these files, plus contradictions internal to the
# gamepack itself. "silent" means the files neither support nor contradict.
# ---------------------------------------------------------------------------
discrepancies:
  - id: spawn_group_size_16
    claim: "Spawn groups should contain 16 points."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn description"
    evidence: "The gamepack works its only example at EIGHT spawns per group: \"you might take 8 spawn points ... assign all eight a group id of 1 then you might do another eight and make their group id all 2 ... 8 spawns for both red and blue teams with group 1 and another 8 spawns ... with group 2.\" 16 appears nowhere. Note the example gives 8 per team per group, so a shared group id covers 16 points across both teams - a plausible origin for the \"16\" figure, but the gamepack never says it."
    action: "Do not hard-fail on group size. If a count check ships at all, base it on 8 per team per group and mark it a warning."
  - id: spawn_spacing_16u
    claim: "Spawn points within a group must be spaced >= 16 units apart."
    verdict: silent   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn description"
    evidence: "Neither .ent file states any minimum spacing between spawn points. The only spacing-like statement about spawns is qualitative and TS specific: TS \"chooses the spawns based on furthest distance from each other rather than in paired groups\". The nearest hard numbers in the gamepack are the info_ut_spawn editor box (32x32x70) and the player width 30.250 from measurment.def, which together imply spawns must be at least ~32 units apart just to not overlap - larger than the claimed 16."
    action: "Cannot be verified here. Either derive the minimum from the player box (32 units, not 16) or confirm against the corpus before shipping."
  - id: ts_dedicated_spawn_entities
    claim: "Team Survivor needs its own dedicated spawn entities; TS cannot be shared with other gametypes via g_gametype."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn g_gametype key + description"
    evidence: "There is no TS-specific spawn classname in the gamepack, and 4 (Team Survivor) is explicitly one of the valid values of info_ut_spawn g_gametype. So TS uses the same entity class and the same key as every other team mode. What the gamepack actually says is narrower: TS must be in SEPARATE GROUPS, not on separate entities - \"give them all gametypes of 3, 5, 6, 7, 8 (all teamplays except gametype 4 TS, gametype 4 should be in separate groups for each team)\". A spawn point listing 4 alongside other ids is what is discouraged, because the group layout TS needs differs - not the entity class."
    action: "Reframe as: an info_ut_spawn whose g_gametype contains 4 together with other ids is suspicious (warning), and TS spawns need their own group partitioning. Do not validate for a nonexistent dedicated TS classname."
  - id: ts_unique_group_names
    claim: "In TS each group takes a unique group name (unlike other modes where both teams share a group name); the game picks the two furthest-apart sets."
    verdict: supports   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn description"
    evidence: "Directly supported, both halves. Shared-group behaviour for normal team modes: \"8 spawns for both red and blue teams with group 1\". Unique-per-team groups for TS: \"if you wanted two spawn areas for each team you would do team blue group 1, team red group 2, team blue group 3, team red group 4.\" Furthest-apart selection: \"The game treats TS (gametype 4) spawns differently. It chooses the spawns based on furthest distance from each other rather than in paired groups.\""
    action: "Safe to ship as a verified rule: for g_gametype containing 4, no group value may carry both team=red and team=blue."
  - id: ffa_does_not_use_info_ut_spawn
    claim: "FFA does not use info_ut_spawn; it uses info_player_start / info_player_deathmatch."
    verdict: supports   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn description + g_gametype value list + notfree/notteam"
    evidence: "Three independent statements in the file agree. (1) info_ut_spawn is \"Spawning position for Urban Terror team game modes.\" (2) Its g_gametype list contains only team modes 3,4,5,6,7,8 - 0 (FFA) and 9 (Jump) are not offered. (3) The notfree key on info_ut_spawn is described as \"will not spawn in Free for all and Jump modes\", framing FFA/Jump as the non-team pair. The file also asserts the corollary requirement: \"You still need info_player_deathmatch or info_player_start in the map to be able to spawn.\" NOT supported by the file: the \"placed sparsely, away from likely firefight centres\" part - that is design advice found nowhere in the gamepack."
    action: "Safe to ship as a verified rule, and stronger than claimed: a map with info_ut_spawn but no info_player_deathmatch / info_player_start is broken outright per the gamepack, in every gametype."
  - id: player_height_56u
    claim: "Player standing height is 56 units (as used by movement_check in the project spec)."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_measurements
    locus: "measure_perfect_player, measure_player_stand"
    evidence: "measurment.def states the exact UrT player as x=30.250 y=30.250 z=69.375, and standing height 69.375 (crouch 48.250). 56 is the legacy Quake 3 player height (-24..+32) and it does survive inside the gamepack as the editor box of info_player_deathmatch (\"-16 -16 -24 16 16 32\") and of the team_CTF_* spawns - but the two UrT-specific spawn classes info_ut_spawn and info_player_start use \"0 0 0 32 32 70\", i.e. the 69.375 figure rounded up. 56 must not be used as the UrT standing height."
    action: "Use 69.375 (headroom 70) for standing and 48.250 (49) for crouch. Treat the 56-unit boxes on info_player_deathmatch and team_CTF_* as legacy editor artwork, not physics."
  - id: gametype_5_name
    claim: "(internal to the gamepack) Gametype 5 has a single name."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn.g_gametype vs func_wall.gametype / ut_mrsentry.gametype / func_rotating_door.gamemode_* / all urtobjects gametype keys"
    evidence: "info_ut_spawn calls id 5 \"Follow the Leader\"; every other gametype table in both files calls id 5 \"Assasins\" (sic). Same id, two names, same gamepack."
    action: "Treat 5 as FTL / Follow the Leader and record the alias. Do not key any logic off the display name."
  - id: gametype_ids_missing
    claim: "(internal) The gametype id space is 0-11."
    verdict: silent   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "all gametype tables"
    evidence: "Both files enumerate only 0,1,3,4,5,6,7,8,9. Id 2 is skipped without comment; ids 10 and 11 never appear. Whether 10/11 are valid in 4.3 cannot be decided from the gamepack."
    action: "See unverified.gametypes_10_11."
  - id: func_rotating_spawnflag_bits
    claim: "(internal) X_AXIS/Y_AXIS spawnflags occupy the same bits on all movers."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "func_bobbing vs func_rotating spawnflags"
    evidence: "func_bobbing declares X_AXIS at bit 0 (value 1) and Y_AXIS at bit 1 (value 2). func_rotating declares X_AXIS at bit 2 (value 4) and Y_AXIS at bit 3 (value 8). The bit numbers are recorded per entity in entities: above; do not share a spawnflag table between movers."
    action: "Read spawnflag bits per classname from this profile, never by flag name."
  - id: info_ut_spawn_flag_named_angle
    claim: "(internal) Spawnflag names do not collide with key names."
    verdict: contradicts   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "info_ut_spawn spawnflags"
    evidence: "info_ut_spawn declares spawnflag bit 1 with the name \"angle\" - the same identifier as its angle KEY - and the gamepack's own description of it is \"IDK?\". Its meaning is unknown even to the gamepack author."
    action: "Do not infer meaning. Flag bit 1 on info_ut_spawn is undocumented; do not validate it."
  - id: crusher_and_style_disabled
    claim: "(internal) Some inherited Q3 features are dead in UrT."
    verdict: supports   # supports | contradicts | silent
    checked_against: gamepack_entities
    locus: "func_door, light, worldspawn"
    evidence: "The gamepack marks several inherited features as non-functional in UrT: func_door CRUSHER (\"CRUSHER don't work in UrT\"), light style (\"Disabled In UrT 4.3\"), worldspawn music (\"Disabled in UrT!\"), worldspawn _styleNalphaGen/_styleNrgbGen (\"Disabled in UrT 4.2/3!\", and commented out in the file), worldspawn globalfog (\"Not working in UrT?\"), func_static targetname (\"NOT SUPPORTED BY RENDERER\"), and func_keyboard_interface as a whole (\"BROKEN!\"). These keys are therefore deliberately NOT present in entities: above, except where the gamepack still declares them."
    action: "A validator may warn when these appear in a map."

