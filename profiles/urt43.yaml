    description: "Variable size repeatable trigger. It will fire the entities it targets when touched by player. Can be made to operate like a trigger_once entity by setting the \"wait\" key to -1. It can also be activated by another trigger that targets it."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "Set the 'wait' key to .25 if using the CloseWhenIdle key when triggering a door. Do not set the 'wait' key to 0 as it causes the trigger to malfunction and not trigger again most of the time after one activation. When the random key is set, its value is used to calculate a minimum and a maximum delay. The final time delay will be a random value anywhere between the minimum and maximum values: (min delay = wait - random) (max delay = wait + random). IMPORTANTS FOR RUN TIMERS: Set wait to 0.1 Also try split this trigger entity in multiple entities over the start line. And make it as thin as possible! (4-8 units) bcs when a player is inside the trigger it will not trigger for any other players until they have exited and the wait time have passed!"}
