  # === light: Light entities ===
  - classname: light
    kind: point
    category: light
    confidence: verified
    source: gamepack_entities
    editor_box: "-8 -8 -8 8 8 8"   # xmin ymin zmin xmax ymax zmax
    description: "Non-displayed point light source. The -pointscale and -scale arguments to Q3Map2 affect the brightness of these lights. The -skyscale argument affects brightness of entity sun lights."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "Q3MAP2 KEYS", confidence: verified, source: gamepack_entities, text: "style: Light style index number associated with worldspawn light style. Values are between 1 and 31. Disabled In UrT 4.3"}
    keys:
      - {name: _light, type: float, default: "300", confidence: verified, source: gamepack_entities, editor_label: "Light Intensity", description: "(OR light) Overrides the default 300 intensity. Negative values may be used for negative lights."}
      - {name: _color, type: color3, default: "1 1 1", confidence: verified, source: gamepack_entities, editor_label: "Light Color", description: "Weighted RGB value of light color (default 1.0 1.0 1.0 = white)."}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "Lights pointed at a target will be spotlights."}
      - {name: radius, type: float, default: "64", confidence: verified, source: gamepack_entities, editor_label: "Spotlight Radius", description: "Overrides the default 64 unit radius of a spotlight at the target point."}
      - {name: _sun, type: boolean, confidence: verified, source: gamepack_entities, editor_label: "Sun", description: "Set this key to 1 on a spotlight to make an infinite sun light."}
      - {name: fade, type: float, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Linear Fade", description: "Fades light attenuation. Only affects linear lights."}
      - {name: scale, type: float, confidence: verified, source: gamepack_entities, editor_label: "Intensity Scale", description: "Scales light attenuation, from SOF2/JK2. Scales the light value."}
      - {name: _deviance, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Penumbra Deviance", description: "Penumbra effect - distance measured in world units for point/spot lights, and degrees for suns (~0.5-3)."}
      - {name: _samples, type: integer, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Penumbra Samples", description: "Penumbra effect - the number of random jitters distributed over the solid arc (~16)."}
      - {name: _filter, type: boolean, confidence: verified, source: gamepack_entities, editor_label: "Lightmap Filtering", description: "Set this key to 1 to toggle on lightmap filtering."}
      - {name: _filterradius, type: float, confidence: verified, source: gamepack_entities, editor_label: "Filter Radius", description: "Filters lightmaps within set radius."}
      - {name: _anglescale, type: float, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Light Attenuation Scale", description: "Scales light attenuation. Smaller values lessens angle attenuation, larger values for sharper, more faceted lighting (default 1.0)."}
      - {name: _extradist, type: string, confidence: verified, source: gamepack_entities, editor_label: "Extra Radius", description: "Adds an extra distance from light ray's origin and the surface they hit. Used to reduce burns."}
    spawnflags:
      - {name: LINEAR, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Linear Falloff", description: "Use a linear falloff. Default is inverse distance squared (more realistic)."}
      - {name: NOANGLE, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "No Angle Attenuation", description: "Ignore angle attenuation."}
      - {name: NOGRIDLIGHT, bit: 4, value: 16, confidence: verified, source: gamepack_entities, editor_label: "Not Dynamic", description: "Do not affect the lightgrid (dynamic entity lighting)."}
