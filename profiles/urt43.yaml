    description: "Generic placeholder for inserting models to map. Model triangles are baked to BSP. MD3, ASE, 3DS, OBJ, FM, LWO, MD2, MDC, MS3D model formats are supported."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "SPAWNFLAGS", confidence: verified, source: gamepack_entities, text: "other possible modes of clipping: CLIPMODEL+AXIAL_BACKPLANE EXTRUDE_FACE_NORMALS+PYRAMIDAL_CLIP - truncated pyramid with 45 degrees sides EXTRUDE_TERRAIN+MAX_EXTRUDE EXTRUDE_TERRAIN+AXIAL_BACKPLANE EXTRUDE_VERTEX_NORMALS + PYRAMIDAL_CLIP - vertex normals mode: don't check for sides, sticking outwards PYRAMIDAL_CLIP+AXIAL_BACKPLANE - pyramid with 3 of 4 sides axial (->small bsp) EXTRUDE_DOWNWARDS+EXTRUDE_UPWARDS EXTRUDE_DOWNWARDS+MAX_EXTRUDE EXTRUDE_DOWNWARDS+AXIAL_BACKPLANE EXTRUDE_DOWNWARDS+EXTRUDE_UPWARDS+MAX_EXTRUDE EXTRUDE_DOWNWARDS+EXTRUDE_UPWARDS+AXIAL_BACKPLANE EXTRUDE_UPWARDS+MAX_EXTRUDE EXTRUDE_UPWARDS+AXIAL_BACKPLANE"}
    keys:
      - {name: model, type: model, confidence: verified, source: gamepack_entities, editor_label: "Model File", description: "Path/name of model to use (e.g. models/mapobjects/teleporter/teleporter.md3)."}
      - {name: angle, type: angle, confidence: verified, source: gamepack_entities, editor_label: "Direction", description: "Direction in which model will be oriented."}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "Individual control of PITCH, YAW, and ROLL (default 0 0 0)."}
      - {name: modelscale, type: float, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Uniform Scale", description: "Floating-point value used to scale a model up or down (default 1.0)."}
      - {name: modelscale_vec, type: vec3, default: "1 1 1", confidence: verified, source: gamepack_entities, editor_label: "Scale XYZ", description: "Floating-point vector used to scale a model's axes individually (default 1.0 1.0 1.0)."}
      - {name: _remap, type: string_list, confidence: verified, source: gamepack_entities, editor_label: "Shader Remaps", description: "Used to remap textures/shaders in the model. To remap all shaders to a given shader, use \"*;models/mymodel/mytexture\". To remap a specific shader, use \"models/mymodel/old;models/mymodel/new\". Any key starting with _remap prefix will work, so if you need more remappings, create _remap2, _remap3 etc keys."}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "Used to attach the misc_model to a brush entity, where its \"targetname\" key is the same value."}
      - {name: _lightmapscale, type: float, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Lightmap Scale", description: "Floating point value, scaling the resolution of lightmaps on this model (if model is using lightmapped shaders) (default 1.0)."}
      - {name: _castshadows, type: integer, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Shadow Caster Level", description: "Allows per-entity control over shadow casting. Defaults to 0 on entities, 1 on world. 0 = no shadow casting. 1 = cast shadows on world. > 1 = cast shadows on entities with _rs (or _receiveshadows) with the corresponding value, AND world. Negative values imply same, but DO NOT cast shadows on world."}
      - {name: _receiveshadows, type: integer, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Shadow Receiver Level", description: "Allows per-entity control over shadow reception. Defaults to 1 on everything (world shadows). 0 = receives NO shadows. > 1 = receive shadows only from corresponding keyed entities (see above) and world. < 1 = receive shadows ONLY from corresponding keyed entities."}
      - {name: _celshader, type: texture, confidence: verified, source: gamepack_entities, editor_label: "Cel Shader", description: "Sets the cel shader used for this geometry. Note: Omit the \"textures/\" prefix."}
      - {name: _clipdepth, type: float, default: "2.0", confidence: verified, source: gamepack_entities, editor_label: "Autoclip thickness", description: "Autoclip brushes thickness (default 2.0)."}
    spawnflags:
      - {name: CLIPMODEL, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Clip Model", description: "Clips the model for player/weapon collisions; extruding every face along most perpendicular axial direction. For use on large architectural or terrain models, not for small decorative models."}
      - {name: FORCEMETA, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "Force Meta", description: "Toggles on q3map_forceMeta for lightmapped models. Converts model triangles to bsp metasurfaces."}
      - {name: EXTRUDE_FACE_NORMALS, bit: 3, value: 8, confidence: verified, source: gamepack_entities, editor_label: "EXTRUDE_FACE_NORMALS", description: "extrude along the model face normals for clipping"}
      - {name: EXTRUDE_TERRAIN, bit: 4, value: 16, confidence: verified, source: gamepack_entities, editor_label: "EXTRUDE_TERRAIN", description: "extrude each surface of the model along its average axial direction ( up/down/west/east/north/south ); faces with not matching direction (or too steep) are clipped in default mode"}
      - {name: COLOR_TO_ALPHA, bit: 5, value: 32, confidence: verified, source: gamepack_entities, editor_label: "COLOR_TO_ALPHA", description: "use the color value as alpha (for terrain blending)"}
      - {name: NOSMOOTH, bit: 6, value: 64, confidence: verified, source: gamepack_entities, editor_label: "NOSMOOTH", description: "Don't smooth normals when importing (forces all faces planar)."}
      - {name: EXTRUDE_VERTEX_NORMALS, bit: 7, value: 128, confidence: verified, source: gamepack_entities, editor_label: "EXTRUDE_VERTEX_NORMALS", description: "extrude along the model vertex normals for clipping; accurate collisions, if normals are fine; bad ones are replaced with 45 degrees to face"}
      - {name: PYRAMIDAL_CLIP, bit: 8, value: 256, confidence: verified, source: gamepack_entities, editor_label: "PYRAMIDAL_CLIP", description: "pyramidal clipping brushes (4-sided); accurate collisions"}
      - {name: EXTRUDE_DOWNWARDS, bit: 9, value: 512, confidence: verified, source: gamepack_entities, editor_label: "EXTRUDE_DOWNWARDS", description: "for horizontal terrain; when not possible, extrude in default mode"}
      - {name: EXTRUDE_UPWARDS, bit: 10, value: 1024, confidence: verified, source: gamepack_entities, editor_label: "EXTRUDE_UPWARDS", description: "-//-"}
      - {name: MAX_EXTRUDE, bit: 11, value: 2048, confidence: verified, source: gamepack_entities, editor_label: "MAX_EXTRUDE", description: "Extrude to the max/min point of every model surface to reduce bsp size (uses axial back plane)"}
      - {name: AXIAL_BACKPLANE, bit: 12, value: 4096, confidence: verified, source: gamepack_entities, editor_label: "AXIAL_BACKPLANE", description: "use axial back plane for clipping brushes to effectively reduce bsp size; might cause unwanted collisions, make sure to -debugclip; negative _clipdepth / -clipdepth limits max thickness of resulting brushes (making non-axial backplane, if hit the limit)"}

  # === world: Worldspawn ===
  - classname: worldspawn
    kind: brush
    category: world
    confidence: verified
    source: gamepack_entities
    description: "Only used for the world."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "KEYS", confidence: verified, source: gamepack_entities, text: "music: Path/name of looping .wav file used for level's music (e.g. music/sonic5.wav). [Disabled in UrT!] gravity: Don't use this! Gravity of level (default 800 = normal gravity). [Do NOT put this at anything other then 800 or messes with gravity for server on other maps!!!] Use trigger_gravity instead!"}
      - {section: "OTHER KEYS", confidence: verified, source: gamepack_entities, text: "globalfog: RGB density eg: .25 .25 0 0.00001 Adds a soft global haze. Not to be used for convential fog. This can be tested in game by starting a devmap and using r_fogdensity 0.0001 r_fog_r .25 r_fog_g .25 r_fog_b .25. (Not working in UrT?)"}
    key_blocks: [q3map2_brush, q3map2_terrain]
    keys:
      - {name: message, type: string, confidence: verified, source: gamepack_entities, editor_label: "Logon Message", description: "Text to print at user logon. Used for name of level."}
      - {name: enablePrecip, type: enum, enum: precipIndex, default: "0", confidence: verified, source: gamepack_entities, editor_label: "EnablePrecip", description: "0 - (default) none, 1 - rain, 2 - snow"}
      - {name: precipAmount, type: string, confidence: verified, source: gamepack_entities, editor_label: "PrecipAmount", description: "up to 1024, number of drops/flakes"}
      - {name: _blocksize, type: integer, default: "1024 1024 0", confidence: verified, source: gamepack_entities, editor_label: "BSP Block Size", description: "Q3Map always splits the BSP tree along the planes X=_blocksize*n and Y=_blocksize*n. Increase the blocksize using larger powers of 2 to reduce compile times on very large maps with a low structural brush density (default 1024 1024 0, 0 values = disable)."}
      - {name: gridsize, type: integer, default: "64 64 128", confidence: verified, source: gamepack_entities, editor_label: "Dynamic Light Granularity", description: "Granularity of the lightgrid, created by q3map, which is used to dynamically light certain game objects, like players and items. Value is three integers separated by spaces, representing number of units between grid points in X Y Z. Default gridsize value is 64 64 128. Use larger powers of 2 to reduce BSP size and compile time on very large maps."}
      - {name: _ambient, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Ambient Intensity", description: "(OR ambient) Adds a constant value to overall lighting. Use is not recommended. Ambient light will have a tendency to flatten out variations in light and shade."}
      - {name: _color, type: color3, default: "1 1 1", confidence: verified, source: gamepack_entities, editor_label: "Ambient Color", description: "RGB value for ambient light color (default 1 1 1)."}
      - {name: _floodlight, type: string, confidence: verified, source: gamepack_entities, editor_label: "Floodlight", description: "RGB distance intensity eg; 1 1 1 512 32. Adds radiosity lighting."}
      - {name: _minlight, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Min Lightmap Intensity", description: "Minimum light value, levelwide. Uses the _color key to set color. Does not add, unlike ambient."}
      - {name: _minvertexlight, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Min Vertex Intensityt", description: "Minimum vertex lighting, levelwide."}
      - {name: _mingridlight, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Min Dynamic Intensity", description: "Minimum lightgrid (dynamic entity lighting) levelwide."}
      - {name: lightdensity, type: string, default: "1", confidence: verified, source: gamepack_entities, editor_label: "Lightdensity", description: "[Broken?]New key that allows the mapper to brighten the textures more than is possible normally. You can test this in game by starting a devmap and using /r_lightdensity 1.3 (or whatever value you like)."}
      - {name: _noshadersun, type: boolean, confidence: verified, source: gamepack_entities, editor_label: "Ignore Shader Sun", description: "Ignore q3map_sun/sun directives in sky shaders and ONLY use entity sun lights."}
      - {name: _farplanedist, type: float, confidence: verified, source: gamepack_entities, editor_label: "Far Clip Distance", description: "Limit on how many units the vis phase of compilation can see. Used in combination with level-wide fog, it can help reduce r_speeds on large, open maps."}
      - {name: _foghull, type: texture, confidence: verified, source: gamepack_entities, editor_label: "Fog Hull Shader", description: "Shader to use for fog hull. Foghull shader should be a sky shader. Omit the textures/ prefix."}
      - {name: _keeplights, type: boolean, confidence: verified, source: gamepack_entities, editor_label: "Keep Light Entities", description: "Keep light entities in the BSP. Normally stripped out by the BSP process and read from the .map file by the lighting phase."}
      - {name: _styleNalphaGen, type: string, confidence: verified, source: gamepack_entities, editor_label: "_styleNalphaGen", note: "declared inside an XML comment in the gamepack, i.e. disabled in the editor; recorded for completeness only", description: "*IMPORTANT* Replace N in the key _styleNalphaGen with an integer between 1 and 31 as your style index. Values takes standard shader waveform functions (e.g. wave sin 0.5 0.3 0.25 1.5) [Disabled in UrT 4.2/3!]"}
      - {name: _styleNrgbGen, type: string, confidence: verified, source: gamepack_entities, editor_label: "_styleNrgbGen", note: "declared inside an XML comment in the gamepack, i.e. disabled in the editor; recorded for completeness only", description: "*IMPORTANT* Replace N in the key _styleNrgbGen with an integer between 1 and 31 as your style index. Values take standard shader waveform functions (e.g. wave sin 0.5 0.3 0.25 1.5) [Disabled in UrT 4.2/3!]"}
    spawnflags: []

# ---------------------------------------------------------------------------
# Answers to the specific "does the gamepack define this?" questions the
# validator design depends on. present: true means a classname with that exact
# spelling exists in one of the .ent files.
# ---------------------------------------------------------------------------
focus:
  - topic: "team spawns"
    classname: "info_ut_spawn"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, point entity, editor box \"0 0 0 32 32 70\". Declares exactly the four keys of interest: team, group, g_gametype, angle (plus angles, notfree, notteam and two spawnflags). team/group/g_gametype are plain strings - the gamepack does not constrain team to an enum here, though its description says \"(red or blue)\"."
  - topic: "FFA spawn"
    classname: "info_player_start"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Description: \"Another player spawn location. Commonly used in Jump maps.\" Editor box \"0 0 0 32 32 70\" (player-sized, same as info_ut_spawn)."
  - topic: "FFA spawn"
    classname: "info_player_deathmatch"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Description: \"Player spawning location.\" Editor box \"-16 -16 -24 16 16 32\" (the legacy Q3 32x32x56 box, not the UrT player size)."
  - topic: "bomb objective"
    classname: "info_ut_bombsite"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, and it is the ONLY bomb-mode entity in the gamepack. It declares NO keys and NO spawnflags. Its description carries two hard rules: must sit directly on the surface (cannot hover), and \"You MUST have 2 bomb sites per map or the map will crash upon loading into bomb mode.\" Plant range is stated as locked to 64 units, with the planted bomb snapping to the entity centre."
  - topic: "bomb objective"
    classname: "ut_weapon_bomb"
    present: true
    confidence: verified
    source: gamepack_objects
    finding: "Defined as a pickup in urtobjects.ent (bombbag model). This is an item spawner, not an objective marker."
  - topic: "bomb objective"
    classname: "info_ut_bomb / ut_bombzone / target_ut_bomb"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. No such classnames anywhere in either file. There is no separate \"objective\" or \"bomb target\" entity beyond info_ut_bombsite."
  - topic: "Capture & Hold"
    classname: "team_CAH_capturepoint"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, point entity, box \"-32 -32 -16 32 32 76\". Declares NO keys. The gamepack states the point is rendered as a flag, a player must touch it to capture, and its displayed location name is taken from the enclosing trigger_location or the nearest target_location - i.e. C&H points depend on location entities for their names."
  - topic: "Capture & Hold"
    classname: "team_CAH_redflag / team_CAH_blueflag"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. C&H has exactly one entity; there are no per-team C&H flag entities."
  - topic: "CTF flags"
    classname: "team_CTF_redflag"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, no keys, editor model models/flags/r_flag.md3."
  - topic: "CTF flags"
    classname: "team_CTF_blueflag"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, no keys, editor model models/flags/b_flag.md3."
  - topic: "CTF spawns"
    classname: "team_CTF_redplayer / team_CTF_blueplayer"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Initial join-team spawn position. Keys: angle, angles, target."
  - topic: "CTF spawns"
    classname: "team_CTF_redspawn / team_CTF_bluespawn"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Respawn-after-frag position. Keys: angle, angles, target. The gamepack section comment for all team_* entities is \"Left as default\", i.e. these were not reviewed against UrT behaviour by the gamepack author."
  - topic: "jump mode"
    classname: "ut_jumpstart"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Run timer start line. Keys: targetname, name (displayed way name), type (way number for multiple timers), color (colorIndex, default 7 = white). Must be attached to a trigger."
  - topic: "jump mode"
    classname: "ut_jumpstop"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Same key set as ut_jumpstart; ends the timed run."
  - topic: "jump mode"
    classname: "ut_jumpcancel"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. Same key set; type 0 cancels all routes, otherwise cancels the matching way number. Used for beginner bypasses."
  - topic: "jump mode"
    classname: "ut_jumpcheckpoint / ut_checkpoint / ut_telepad"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. The gamepack has NO checkpoint entity and NO telepad entity. Jump-map teleports are built from stock trigger_teleport / target_teleporter plus misc_teleporter_dest, or from the documented high-speed func_door / func_plat \"door teleporter\" trick. Route timing is exactly the three ut_jump* entities."
  - topic: "ladders"
    classname: "ut_ladder / func_ladder"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. There is no ladder entity of any kind in either file. The only ladder-related string in the whole gamepack is the shader script name \"jeffladderclip\" in default_shaderlist.txt, which is consistent with ladders being a surface/shader property rather than an entity. Needs corpus + shader confirmation before any ladder validator ships."
  - topic: "breakable windows"
    classname: "func_breakable"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined as a brush entity and it is the only breakable mechanism. Glass is type 0 of the breakIndex enum, and the gamepack states \"For glass windows that break easily, set health to 1.\" Keys: type, health, axis, shards, bombable. There is no window-specific classname."
  - topic: "breakable windows"
    classname: "func_breakable_window / ut_glass"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. No dedicated window classname exists."
  - topic: "spawn doors"
    classname: "func_door"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined, and it is the spawn-door mechanism: keys only (teamIndex red/blue, \"used for CTF or other respawn type modes to create spawn rooms\"), CloseWhenIdle, trigger_only and team. The gamepack documents the recipe: CloseWhenIdle + trigger_only + a trigger_multiple with wait around 0.25. trigger_multiple and func_rotating_door carry the same `only` key."
  - topic: "spawn doors"
    classname: "func_ut_spawndoor / func_spawndoor"
    present: false
    confidence: verified
    source: gamepack_entities
    absence_checked_in: [gamepack_entities, gamepack_objects]
    finding: "ABSENT. No dedicated spawn-door classname; it is a keyed func_door."
  - topic: "spawn-room policing"
    classname: "ut_mrsentry"
    present: true
    confidence: verified
    source: gamepack_entities
    finding: "Defined. CTF spawn-room sentry cannon. Keys: team (teamIndex), angle, gametype. Requires the spawn room to be enclosed in a nodrop brush for its anti-flag-camping behaviour to work."

