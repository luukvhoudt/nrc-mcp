      - {name: range, type: float, confidence: verified, source: gamepack_entities, editor_label: "Range", description: "Number of units that the bot can move away from camp entity while camping on it."}
      - {name: weight, type: float, confidence: verified, source: gamepack_entities, editor_label: "Weight", description: "Number that is compared against the weight assigned to all the other camp spots in the map to determine if a bot chooses to camp there. The value is normalized against all other weight values."}
