  - classname: func_ut_train
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "A train is a mover that moves between path_ut_stop target points. This entity is partly broken BUT can be made to function as a basic train with multiple path locations. But avoid using this unless you know what you are doing or want to mess around and debug weird things!"
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "- Trains MUST HAVE AN ORIGIN BRUSH! - The train spawns at the first target it is pointing at! - Cruscher will always be active and is not possible to turn off! - To use more then 1 train you need to give all trains the same targetname but different id's, and make sure the id only uses numbers! - To start just 1 train, when you have more then 1 in the map, trigger the next path_ut_stop instead of the actual train! - Trains in a loop cannot be stopped! - If a train is standing still you can trigger a path_ut_stop to make the train travel to it! - Trains travel paths can be weird as hell! - In short don't use trains in serious maps unless you know what you are doing! Simple guide: http://wiki.custommapmakers.org/index.php?title=How_to_create_a_func_ut_train"}
