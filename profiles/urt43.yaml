      - {name: phase, type: float, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Swing Phase", description: "Sets the start offset of the swinging cycle. Values must be 0 < phase < 1. Any integer phase value is the same as no offset (default 0)."}
