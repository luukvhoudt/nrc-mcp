  - classname: func_plat
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "Rising platform the player can ride to reach higher places. Plats must always be drawn in the raised position, so they will operate and be lighted correctly but they spawn in the lowered position. The plat will stay in the raised position until the player steps off. There are no proper sounds for this entity, only beep noises. It will spawn in the game and work properly but it sounds silly (see notes)."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "By default, the total amount of vertical travel of a platform is implicitly determined by the overall vertical size of the brushes of which it's made minus the lip value. But if the \"height\" key is used, then the total amount of vertical travel of the plat will be exactly that value regardless of the shape and size of the plat and regardless of the value of the \"lip\" key. Using the \"height\" key is the best method for any kind of platforms and the only possible one for thin plats which need to travel vertical distances many times their own thickness. Setting the origin key is simply an alternate method to using an origin brush. When using the model2 key, the origin point of the model will correspond to the origin point defined by either the origin brush or the origin coordinate value. There is a way to make plats play proper sounds. Just create a sound\\movers\\plats folder under baseq3 and put 2 sounds named pt1_strt.wav and pt1_end.wav in it. Those can be the renamed sounds from the Q2 plats or renamed copies of the sound\\movers\\doors sounds you can extract from your pak0.pk3 file or new custom sounds if you're up to it. Thanks to Fragzilla for the tip. May also be descending platform with negative \"height\" or according \"lip\" keys set."}
      - {section: "DOOR TELEPORTERS (Simple explanation)", confidence: verified, source: gamepack_entities, text: "If a object is set to move so fast that it moves from 1 of it points to the other in an instant and hits the player in it's travel it will \"teleport\" the player. This teleport will move the player the FULL LENGHT OF THE BRUSH/DOOR that hits THEM, no matter where in it's travel path it hits. (Even if at the very end it will still send full lenght) It will also allow the player to keep their speed and direction. Speed: Over 1000000 tend to always work, higher makes no difference I think. lip: Should be put as 0 most of the time. Since it can influence travel distance so keep this at 0 for easy distance calculation. CloseWhenIdle: Tend to have a mini delay before it it returns back so it is often suboptimal to use. Instead: Use a target_relay and a target_delay set to wait 0.1! that then targets this entity and set wait to -1. Warning: If end destination is inside a solid object the player will get stuck in door without teleporting! Warning2: Wall running can trick the game to think you would endup in a wall, same with curved walls/ramps. (Make sure to always test for this just!) In general func_door and func_plat works best, but could probably use any func_that can move fast."}
    key_blocks: [q3map2_brush, model_attach, spawn_filter, q3map2_terrain]
    keys:
      - {name: speed, type: float, default: "200", confidence: verified, source: gamepack_entities, editor_label: "Move Speed", description: "Determines how fast the plat moves (default 200). See notes about using speed key to make door teleporters."}
      - {name: lip, type: float, default: "8", confidence: verified, source: gamepack_entities, editor_label: "Lip", description: "Lip remaining at end of move (default 8). Has no effect if height is set."}
      - {name: height, type: float, confidence: verified, source: gamepack_entities, editor_label: "Vertical Travel", description: "If set, this will determine the total amount of vertical travel of the plat."}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "All entities with a matching targetname will be triggered."}
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Targetname", description: "Can be used to attach a misc_model entity to this entity."}
    spawnflags: []
  - classname: func_rotating
