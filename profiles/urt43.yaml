  - classname: target_speaker
    kind: point
    category: target
    confidence: verified
    source: gamepack_entities
    editor_box: "-8 -8 -8 8 8 8"   # xmin ymin zmin xmax ymax zmax
    description: "Sound generating entity that plays .wav files. Normal non-looping sounds play each time the target_speaker is triggered. Looping sounds can be set to play by themselves (no activating trigger) or be toggled on/off by a trigger."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "The path portion value of the \"noise\" key can be replaced by the implicit folder character \"*\" for triggered sounds that belong to a particular player model. For example, if you want to create a \"bottomless pit\" in which the player screams and dies when he falls into, you would place a trigger_multiple over the floor of the pit and target a target_speaker with it. Then, you would set the \"noise\" key to \"*falling1.wav\". The * character means the current player model's sound folder. So if your current player model is Visor, * = sound/player/visor, if your current player model is Sarge, * = sound/player/sarge, etc. This cool feature provides an excellent way to create \"player-specific\" triggered sounds in your levels. The combination of the \"wait\" and \"random\" keys can be used to play non-looping sounds without requiring an activating trigger but both keys must be used together. The value of the \"random\" key is used to calculate a minimum and a maximum delay. The final time delay will be a random value anywhere between the minimum and maximum values: (min delay = wait - random) (max delay = wait + random). Warning, if a lot of these are used in a big jump map it can cause problems! (200+) [combins with some other target_* entities, like target_location] LOOPED sounds are globally loaded meaning even if no player is in the active area the sound will not reset. Where as if you do use a combination of 'wait' and 'random' key the entity is not globally loaded and will be reset if no player is in the area to key the entity loaded."}
    key_blocks: [spawn_filter]
    keys:
      - {name: noise, type: sound, confidence: verified, source: gamepack_entities, editor_label: "Sound File", description: "Path/name of .wav file to play (e.g. sound/world/growl1.wav - see notes)."}
      - {name: wait, type: float, confidence: verified, source: gamepack_entities, editor_label: "Repeat Time", description: "Delay in seconds between each time the sound is played (random key must be set - see notes)."}
      - {name: random, type: float, confidence: verified, source: gamepack_entities, editor_label: "Repeat Time Variance", description: "Random time variance in seconds added or subtracted from wait delay (wait key must be set - see notes)."}
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Targetname", description: "The activating button or trigger points to this."}
    spawnflags:
      - {name: LOOPED_ON, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Loop, Start On", description: "Sound will loop and initially start on in level (will toggle on/off when triggered)."}
      - {name: LOOPED_OFF, bit: 1, value: 2, confidence: verified, source: gamepack_entities, editor_label: "Loop, Start Off", description: "Sound will loop and initially start off in level (will toggle on/off when triggered)."}
      - {name: GLOBAL, bit: 2, value: 4, confidence: verified, source: gamepack_entities, editor_label: "Global Sound", description: "Sound will play full volume throughout the level."}
      - {name: ACTIVATOR, bit: 3, value: 8, confidence: verified, source: gamepack_entities, editor_label: "Audible Only To Activator", description: "Sound will play only for the player that activated the target."}
