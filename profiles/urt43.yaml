    counts: planes
    confidence: unverified
    source: "classic Q3 MAX_MAP_PLANES (0x20000) — not read from engine source"
  shaders:
    value: 1024
    counts: shaders
    confidence: unverified
    source: "classic Q3 MAX_MAP_SHADERS (0x400) — not read from engine source"
  draw_surfaces:
    value: 131072
    counts: draw_surfaces
    confidence: unverified
    source: "classic Q3 MAX_MAP_DRAW_SURFS (0x20000) — not read from engine source"
  draw_verts:
    value: 524288
    counts: draw_verts
    confidence: unverified
    source: "classic Q3 MAX_MAP_DRAW_VERTS (0x80000) — not read from engine source"
  draw_indexes:
    value: 524288
    counts: draw_indexes
    confidence: unverified
    source: "classic Q3 MAX_MAP_DRAW_INDEXES (0x80000) — not read from engine source"
  models:
