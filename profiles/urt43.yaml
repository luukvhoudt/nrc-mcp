    keys: [g_gametype]
    format: "comma-separated ids, e.g. 3, 5, 6"
    note: "Only info_ut_spawn uses this key and this syntax."
  boolean_filters:
    keys: [notfree, notteam]
    notfree: "When set to 1, entity will not spawn in Free for all and Jump modes."
    notteam: "When set to 1, entity will not spawn in Teamplay and CTF modes."

