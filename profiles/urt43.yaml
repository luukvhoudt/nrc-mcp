    description: "Normal sliding door entity."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "To use the CloseWhenIdle setting for CTF Spawn Room doors, you must also set trigger_only, and use a trigger_multiple to open the door. This will cause the door to remain open only as long as a player is in the triggering brush. Set the 'wait' key on the trigger_multiple to a very low value( < 1 like .25 ) If you want doors to operate together, you have to team them manually by assigning the same team name to all of them. Setting the origin key is simply an alternate method to using an origin brush. When using the model2 key, the origin point of the model will correspond to the origin point defined by either the origin brush or the origin coordinate value. Target this entity with a misc_model to have the model attached to the entity (set the model's \"target\" key to the same value as this entity's \"targetname\"). And you can connect a button with target it to open it and a model to target it to connect the model to it and have the model be opened by the button."}
      - {section: "DOOR TELEPORTERS (Simple explanation)", confidence: verified, source: gamepack_entities, text: "If a object is set to move so fast that it moves from 1 of it points to the other in an instant and hits the player in it's travel it will \"teleport\" the player. This teleport will move the player the FULL LENGHT OF THE BRUSH/DOOR that hits THEM, no matter where in it's travel path it hits. (Even if at the very end it will still send full lenght) It will also allow the player to keep their speed and direction. Speed: Over 1000000 tend to always work, higher makes no difference I think. lip: Should be put as 0 most of the time. Since it can influence travel distance so keep this at 0 for easy distance calculation. CloseWhenIdle: Tend to have a mini delay before it it returns back so it is often suboptimal to use. Instead: Use a target_relay and a target_delay set to wait 0.1! that then targets this entity and set wait to -1. Warning: If end destination is inside a solid object the player will get stuck in door without teleporting! Warning2: Wall running can trick the game to think you would endup in a wall, same with curved walls/ramps. (Make sure to always test for this just!) In general func_door and func_plat works best, but could probably use any func_that can move fast."}
      - {section: "SPAWNFLAGS", confidence: verified, source: gamepack_entities, text: "CRUSHER : Door will not reverse direction when blocked and will keep damaging player until he dies or gets out of the way. (CRUSHER don't work in UrT)"}
    key_blocks: [q3map2_brush, model_attach, spawn_filter, q3map2_terrain]
    keys:
      - {name: angle, type: direction, confidence: verified, source: gamepack_entities, editor_label: "Direction", description: "Determines the direction in which the button will move (up = -1, down = -2)."}
      - {name: angle, type: enum, enum: angleIndex, confidence: verified, source: gamepack_entities, editor_label: "Quick Select Direction", note: "second declaration of this key in the gamepack, exposing a different editor widget for the same value", description: "Alternative to quickly select the common angles"}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "Advanced angle control. This sets the pitch, yaw and roll aiming angles of entity (default 0 0 0)"}
      - {name: speed, type: float, default: "400", confidence: verified, source: gamepack_entities, editor_label: "Move Speed", description: "Determines how fast the door moves (default 400). See notes about using speed key to make door teleporters."}
      - {name: wait, type: float, default: "2", confidence: verified, source: gamepack_entities, editor_label: "Return Delay", description: "Number of seconds before door returns (default 2, -1 = return immediately)."}
      - {name: lip, type: float, default: "8", confidence: verified, source: gamepack_entities, editor_label: "Lip", description: "Lip remaining at end of move (default 8). Set to less then 0 to have door move futher away"}
      - {name: health, type: integer, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Health", description: "If set to a non-zero value, the door must be damaged by health amount of points to operate."}
      - {name: CloseWhenIdle, type: boolean, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Close When Idle", description: "When set to 1, the door will close as soon as there are no players in the triggering brush (For CTF Spawn Room doors, SEE NOTES!) (There is still a mini delay before closing)"}
      - {name: trigger_only, type: boolean, default: "0", confidence: verified, source: gamepack_entities, editor_label: "Trigger Only", description: "Set to 1 if the door can only be opened by a switch or trigger (ie: prevents a player from opening it manually)"}
      - {name: team, type: string, confidence: verified, source: gamepack_entities, editor_label: "Team", description: "Assign the same team name to multiple doors that should operate together."}
      - {name: only, type: enum, enum: teamIndex, values: ["red", "blue", ""], confidence: verified, source: gamepack_entities, editor_label: "Only", description: "Set to allow only one team to use this entity, used for CTF or other respawn type modes to create spawn rooms. Values: blue or red - Default: anyone"}
      - {name: target, type: target, confidence: verified, source: gamepack_entities, editor_label: "Target", description: "When the door is opend or closed it will trigger this. If the door is closing the trigger will be delayed and in some cases not work."}
      - {name: pos1, type: sound, default: "none", confidence: verified, source: gamepack_entities, editor_label: "Start Moving - Sound File", description: "Sound to play when door starts moving (none for nothing, defaults to a creak)"}
      - {name: pos2, type: sound, default: "none", confidence: verified, source: gamepack_entities, editor_label: "Stop Moving - Sound File", description: "Sound to play when door stops moving (none for nothing, defaults to a creak)"}
      - {name: noise, type: sound, confidence: verified, source: gamepack_entities, editor_label: "Sound File", description: "Looping sound as door is moving"}
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Targetname", description: "Can be used to attach a misc_model entity to this entity."}
    spawnflags:
      - {name: START_OPEN, bit: 0, value: 1, confidence: verified, source: gamepack_entities, editor_label: "Start_open", description: "The door will spawn in the open state and operate in reverse."}
