# Key sets that the gamepack repeats verbatim across many classes. An entity
# listing a block name below inherits every key in it.
key_blocks:
  q3map2_brush:
    confidence: verified
    source: gamepack_entities
    note: "compiler (q3map2) per-entity lighting/shadow keys, from the \"Q3MAP2 KEYS\" section of the gamepack entry"
    keys:
      - {name: _lightmapscale, type: float, default: "1", confidence: verified, source: gamepack_entities, description: "Floating point value scales the resolution of lightmaps on brushes/patches in this entity (default 1.0)."}
      - {name: _cs, type: integer, default: "0", confidence: verified, source: gamepack_entities, description: "Allows per-entity control over shadow casting. Defaults to 0 on entities, 1 on world. 0 = no shadow casting. 1 = cast shadows on world. > 1 = cast shadows on entities with _rs (or _receiveshadows) with the corresponding value, AND world. Negative values imply same, but DO NOT cast shadows on world."}
      - {name: _rs, type: integer, default: "1", confidence: verified, source: gamepack_entities, description: "Allows per-entity control over shadow reception. Defaults to 1 on everything (world shadows). 0 = receives NO shadows. > 1 = receive shadows only from corresponding keyed entities (see above) and world. < 1 = receive shadows ONLY from corresponding keyed entities."}
      - {name: _celshader, type: texture, confidence: verified, source: gamepack_entities, description: "Sets the cel shader used for this geometry. Note: Omit the textures/ prefix."}
  model_attach:
    confidence: verified
    source: gamepack_entities
    note: "keys for attaching an .md3 to a brush entity, from the \"MODEL KEYS\" section of the gamepack entry"
    keys:
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, description: "Can be used to attach a misc_model entity to this entity."}
      - {name: model2, type: model, confidence: verified, source: gamepack_entities, description: "Path/name of model to include (.md3 files only, e.g. models/mapobjects/jets/jets01.md3)."}
      - {name: origin, type: vec3, confidence: verified, source: gamepack_entities, description: "Alternate method of setting XYZ origin of sound and .md3 model included with entity (see notes)."}
      - {name: light, type: float, default: "0", confidence: verified, source: gamepack_entities, description: "ConstantLight radius of .md3 model included with entity. Has no effect on the entity's brushes (default 0)."}
      - {name: color, type: color3, default: "1 1 1", confidence: verified, source: gamepack_entities, description: "ConstantLight color of .md3 model included with entity. Has no effect on the entity's brushes (default 1 1 1)."}
  spawn_filter:
    confidence: verified
    source: gamepack_entities
    note: "gametype spawn filter, from the \"SPAWN KEYS\" section of the gamepack entry"
    keys:
      - {name: notfree, type: boolean, confidence: verified, source: gamepack_entities, description: "When set to 1, entity will not spawn in Free for all and Jump modes."}
      - {name: notteam, type: boolean, confidence: verified, source: gamepack_entities, description: "When set to 1, entity will not spawn in Teamplay and CTF modes."}
  q3map2_terrain:
    confidence: verified
    source: gamepack_entities
    note: "legacy q3map2 terrain keys, from the \"Q3MAP2 TERRAIN KEYS\" section of the gamepack entry"
    keys:
      - {name: alphamap, type: texture, confidence: verified, source: gamepack_entities, description: "Path/name for the art file used to guide the mapping of textures on the terrain surface."}
      - {name: layers, type: integer, confidence: verified, source: gamepack_entities, description: "Integer value denotes number of unique root shaders that will be used on the terrain."}
      - {name: shader, type: texture, confidence: verified, source: gamepack_entities, description: "Path to the metashader used to assign textures to the terrain entity. Note: Omit the textures/ prefix."}

# ---------------------------------------------------------------------------
# ENTITIES
# Every classname defined in urtentities.ent (61) and urtobjects.ent (34) = 95.
# `kind`: point = point entity (editor box given); brush = must own brushes.
# Duplicate key names inside one entity are intentional: the gamepack declares
# the same key twice with two different editor widgets (e.g. a free-form value
# and an enum quick-pick). Both entries are kept.
# ---------------------------------------------------------------------------
entities:

  # === spawn_team: Team-mode spawn point (the core UrT spawn entity) ===
  - classname: info_ut_spawn
    kind: point
    category: spawn_team
    confidence: verified
    source: gamepack_entities
    editor_box: "0 0 0 32 32 70"   # xmin ymin zmin xmax ymax zmax
    description: "Spawning position for Urban Terror team game modes. You still need info_player_deathmatch or info_player_start in the map to be able to spawn. You would use the groups key in maps if you wanted to make sure a team will spawn together in a certain location, so you might take 8 spawn points, give them all gametypes of \"3, 5, 6, 7, 8\" (all teamplays except gametype 4 TS, gametype 4 should be in separate groups for each team) and then assign all eight a group id of \"1\" then you might do another eight and make their group id all \"2\". Then do the same for the other team e.g.: 8 spawns for both red and blue teams with group 1 and another 8 spawns for both red and blue teams with group 2. UT will choose a \"group\" at the begining of a round and spawn all members of the \"teams\" there. Normally you'd have a few groups of spawns so you could have lots of potential team starting positions. Note: The game treats TS (gametype 4) spawns differently. It chooses the spawns based on furthest distance from each other rather than in paired groups. So if you wanted two spawn areas for each team you would do team blue group 1, team red group 2, team blue group 3, team red group 4."
    key_blocks: [spawn_filter]
    keys:
      - {name: angle, type: angle, confidence: verified, source: gamepack_entities, editor_label: "Direction", description: "Direction in which player will look when spawning in the game."}
      - {name: angles, type: angles3, confidence: verified, source: gamepack_entities, editor_label: "Pitch Yaw Roll", description: "This sets the pitch, yaw and roll aiming angles of entity (default 0 0 0)"}
      - {name: g_gametype, type: string, confidence: verified, source: gamepack_entities, editor_label: "Gametype", note: "gamepack spells the key g_gametype here (other classes use gametype); the listed ids are the team modes only: 3 4 5 6 7 8", description: "a list of gametypes on which to use this spawn eg: 3, 5, 6 Urban Terror team gametype mappings are: Team Deathmatch 3 Team Survivor 4 Follow the Leader 5 Capture And Hold 6 Capture The Flag 7 Bomb 8"}
      - {name: team, type: string, values: ["red", "blue"], confidence: verified, source: gamepack_entities, editor_label: "Team", description: "team that this spawn belongs to (red or blue)"}
