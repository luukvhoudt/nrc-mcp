  - classname: func_breakable
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "A breakable thing just sits there, doing nothing, but will break if damaged or collided with."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "- For glass windows that break easily, set health to 1. - Any func_breakable with a health of less than 10 will slowly weaken if a player is in contact with it. You can make a roof that collapses in after a period of time by setting the health to a value like 5. This will mean that a player standing on such a surface for around 5 seconds will fall thru. The effect is cumulative: if you stand there for 3 seconds and then come back you can only stand on it for another 2 seconds. - The type parameter selects the shader that is used for fragments and sets the sound the object makes when it breaks. - If the brush you are making is on an angle (for example, a skylight in a sloping roof) then you will need to set the break axis to \"4\" if you want it to break when people stand on it. - You can build anything to break using the breakables. You can make a model breakable without having to use the model2 key. Just right click with it selected and choose func_breakable. - Set shards as high as you want (it maxes out at 32 anyway) - players can reduce the number of shards they see using cg_maxFragments - Bombable key is to be used for things that can only be broken by the Bomb Mode bomb explosion. For example a large propane tank near a bomb target. The key's value will determine the size of the explosion graphics from this entity when broken, with a value of 1 being no explosion and a value of 255 being a large secondary blast. - Type values info for 1,2,3,4 - The game will attenuate the damage caused by each hit to a value of 1-3. Health values above 10 will choose a random health between 6 and 10. Specifics are as follows: 0: is for glass/windows 1: is for all woods 2: is for ceramics and pottery 3: is for various plastics 4: is for metal that can be broken by normal means - Type values info for 5,6,7,8,9,10 - The game will use the literal health value compared to the weapon damages. They should be set quite high (metals and stone at 50+). Specifics are as follows: 5: is for metal that requires explosives to break (HE grenade or hk69) 6: is for metal that requires the hk69 to break 7: is for stone that requires explosives to break (HE grenade or hk69) 8: is for stone that requires the hk69 to break 9: is for wood that requires explosives to break (HE grenade or hk69) 10: is for wood that requires the hk69 to break"}
    key_blocks: [q3map2_brush, model_attach, spawn_filter, q3map2_terrain]
    keys:
      - {name: type, type: enum, enum: breakIndex, confidence: verified, source: gamepack_entities, editor_label: "Object Type", description: "0: glass 1: wood 2: ceramic 3: plastic 4: metal-normal 5: metal-explosives 6: metal-hk69 7: stone-explosives 8: stone-hk69 9: wood-explosives 10: wood-hk69 - Type values info for 1,2,3,4 - The game will attenuate the damage caused by each hit to a value of 1-3. Health values above 10 will choose a random health between 6 and 10. Specifics are as follows: 0: is for glass/windows 1: is for all woods 2: is for ceramics and pottery 3: is for various plastics 4: is for metal that can be broken by normal means - Type values info for 5,6,7,8,9,10 - The game will use the literal health value compared to the weapon damages. They should be set quite high (metals and stone at 50+). Specifics are as follows: 5: is for metal that requires explosives to break (HE grenade or hk69) 6: is for metal that requires the hk69 to break 7: is for stone that requires explosives to break (HE grenade or hk69) 8: is for stone that requires the hk69 to break 9: is for wood that requires explosives to break (HE grenade or hk69) 10: is for wood that requires the hk69 to break"}
      - {name: health, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Health", description: "health of object"}
      - {name: axis, type: enum, enum: axis2Index, confidence: verified, source: gamepack_entities, editor_label: "Axis", description: "1 - x, 2 - y, 4 - z"}
      - {name: shards, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Shards", description: "number of shards object should shatter into (0-255)"}
      - {name: bombable, type: integer, confidence: verified, source: gamepack_entities, editor_label: "Bombable", description: "allows the entity to be destroyed by the bomb in bomb mode. The size of blast shown when the entity breaks is determined by this value (Values : 1 none - 255 huge blast)."}
    spawnflags: []
