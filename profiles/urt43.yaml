      - {name: only, type: enum, enum: teamIndex, confidence: verified, source: gamepack_entities, editor_label: "Only", description: "set to allow only one team to use this entity, used for CTF or other respawn type modes to create spawn rooms. Values: blue or red - Default: anyone"}
      - {name: pos1, type: sound, default: "none", confidence: verified, source: gamepack_entities, editor_label: "Start Moving - Sound File", description: "Sound to play when door starts moving (none for nothing, defaults to a creak)"}
      - {name: pos2, type: sound, default: "none", confidence: verified, source: gamepack_entities, editor_label: "Stop Moving - Sound File", description: "Sound to play when door stops moving (none for nothing, defaults to a creak)"}
      - {name: noise, type: sound, confidence: verified, source: gamepack_entities, editor_label: "Sound File", description: "Looping sound as door is moving"}
      - {name: targetname, type: targetname, confidence: verified, source: gamepack_entities, editor_label: "Targetname", description: "Can be used to attach a misc_model entity to this entity."}
    spawnflags: []
  - classname: func_static
    kind: brush
    category: mover
    confidence: verified
    source: gamepack_entities
    description: "Static non-solid bspmodel. Can be used for conditional walls and models."
    notes:   # prose sections of the gamepack entry, verbatim wording
      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "When using the model2 key, the origin point of the model will correspond to the origin point defined by either the origin brush or the origin coordinate value. If a model is included with a targeted func_static, the brush(es) of the entity will be removed from the game but the .md3 model won't: It will automatically be moved to the (0 0 0) world origin so you should NOT include an .md3 model to a targeted func_static. Because the map has only a single bot navigation file, func_static's cannot be used to make significant changes in game play flow between differing game types. Target this entity with a misc_model to have the model attached to the entity (set the model's \"target\" key to the same value as this entity's \"targetname\")."}
