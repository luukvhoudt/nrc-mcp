      - {section: "NOTES", confidence: verified, source: gamepack_entities, text: "You need to have an origin brush as part of this entity. The center of that brush will be the point through which the rotation axis passes. Setting the origin key is simply an alternate method to using an origin brush. It will rotate along the Z axis by default. You can check either the X_AXIS or Y_AXIS box to change that. When using the model2 key, the origin point of the model will correspond to the origin point defined by either the origin brush or the origin coordinate value. Target this entity with a misc_model to have the model attached to the entity (set the model's \"target\" key to the same value as this entity's \"targetname\")."}
    key_blocks: [q3map2_brush, model_attach, spawn_filter, q3map2_terrain]
