[workspace]
members = ["crates/nrc-core", "crates/nrc-cli", "crates/nrc-py"]
resolver = "2"

[workspace.package]
version    = "0.1.0"
edition    = "2021"
license    = "GPL-2.0-or-later"
repository = "https://github.com/lvanhoudt/nrc-mcp"
rust-version = "1.75"

[workspace.dependencies]
nrc-core = { path = "crates/nrc-core" }

[profile.release]
# The kernel is called per-tool-invocation from Python; startup and throughput
# both matter more than compile time here.
opt-level     = 3
lto           = "thin"
codegen-units = 1
